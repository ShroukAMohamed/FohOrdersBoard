<div class="flex flex-col items-stretch gap-3 rounded-lg border border-outline-variant/20 bg-surface-container-low p-3 md:flex-row md:items-start" [formGroup]="item()">
  <div class="min-w-0 flex-[2]">
    <label class="mb-1 block text-[11px] leading-[14px] font-semibold tracking-wider text-on-surface-variant uppercase" [attr.for]="menuId()">Menu Item</label>
    <select
      class="min-h-11 w-full rounded-[0.25rem] border border-outline-variant/50 bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary"
      [id]="menuId()"
      formControlName="menuId"
      [attr.aria-invalid]="showMenuError()"
    >
      <option value="">Select a menu item</option>
      @for (entry of menu(); track entry.id) {
        <option [value]="entry.id">{{ entry.name }} — EGP {{ entry.price.toFixed(2) }}</option>
      }
    </select>
    @if (showMenuError()) {
      <p class="mt-1 text-xs text-error" role="alert">Select a menu item.</p>
    }
  </div>

  <div class="w-full shrink-0 md:w-36">
    <label class="mb-1 block text-[11px] leading-[14px] font-semibold tracking-wider text-on-surface-variant uppercase" [attr.for]="qtyId()">Qty (1–20)</label>
    <div class="flex min-h-11 items-center rounded-[0.25rem] border border-outline-variant/50 bg-surface-container-lowest shadow-sm">
      <button type="button" class="grid size-11 place-items-center rounded-l-[0.25rem] text-on-surface-variant hover:bg-surface-container-high" aria-label="Decrease quantity" (click)="adjustQty(-1)">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">remove</span>
      </button>
      <input
        class="w-full bg-transparent py-1 text-center font-mono text-sm outline-none"
        type="number"
        min="1"
        max="20"
        step="1"
        [id]="qtyId()"
        formControlName="qty"
        [attr.aria-invalid]="showQtyError()"
      />
      <button type="button" class="grid size-11 place-items-center rounded-r-[0.25rem] text-on-surface-variant hover:bg-surface-container-high" aria-label="Increase quantity" (click)="adjustQty(1)">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span>
      </button>
    </div>
    @if (showQtyError()) {
      <p class="mt-1 text-xs text-error" role="alert">Enter a whole number from 1 to 20.</p>
    }
  </div>

  <div class="min-w-0 flex-[2]">
    <label class="mb-1 block text-[11px] leading-[14px] font-semibold tracking-wider text-on-surface-variant uppercase" [attr.for]="noteId()">Kitchen Note</label>
    <input
      class="min-h-11 w-full rounded-[0.25rem] border border-outline-variant/50 bg-surface-container-lowest px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary"
      type="text"
      [id]="noteId()"
      formControlName="note"
      placeholder="e.g. Extra crispy pita, sauce on side"
    />
  </div>

  <div class="self-end md:self-center md:pt-5">
    <button type="button" class="grid size-11 place-items-center rounded-[0.25rem] bg-surface-container text-on-surface-variant hover:bg-error-container hover:text-on-error-container" [attr.aria-label]="'Remove item ' + (index() + 1)" (click)="remove.emit()">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">delete</span>
    </button>
  </div>
</div>
